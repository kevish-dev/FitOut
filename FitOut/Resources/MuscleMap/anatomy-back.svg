.muscle.selected { fill: #8cac47; stroke: #d0ff79; stroke-width: 2; }
.muscle:focus-visible { stroke: white; stroke-width: 2.5; }
@media (prefers-reduced-motion: no-preference) { .muscle { transition: fill 160ms, stroke 160ms; } }
