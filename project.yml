name: FitOut
options:
  bundleIdPrefix: com.kevishsewliya.fitout
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5ZYXTW5M3R
targets:
  FitOut:
    type: application
    platform: iOS
    sources:
      - path: FitOut
        excludes: [Resources]
      - path: FitOut/Resources
        buildPhase: resources
    info:
      path: FitOut/Info.plist
      properties:
        CFBundleDisplayName: FitOut
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.kevishsewliya.fitout.widgets
            CFBundleURLSchemes: [fitout]
        NSHealthShareUsageDescription: FitOut reads selected activity, workouts, nutrition and body measurements to show your personal progress.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Inter-Regular.otf, Inter-Medium.otf, Inter-SemiBold.otf, Inter-Bold.otf, orbitron-700.ttf, orbitron-800.ttf, rajdhani-500.ttf, rajdhani-600.ttf]
    entitlements:
      path: FitOut/FitOut.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups: [group.com.kevishsewliya.fitout]
    dependencies:
      - target: FitOutWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevishsewliya.fitout
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  FitOutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FitOutWidgets
      - path: FitOut/Widgets/WidgetData.swift
      - path: FitOut/Widgets/WidgetSharedStore.swift
      - path: FitOut/Widgets/WaterWidgetIntents.swift
      - path: FitOut/Features/Workouts/WorkoutLiveAttributes.swift
      - path: FitOut/Features/Workouts/WorkoutLiveIntents.swift
      - path: FitOut/Resources/Fonts/Inter-Medium.otf
        buildPhase: resources
      - path: FitOut/Resources/Fonts/orbitron-700.ttf
        buildPhase: resources
    info:
      path: FitOutWidgets/Info.plist
      properties:
        CFBundleDisplayName: FitOut Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [Inter-Medium.otf, orbitron-700.ttf]
    entitlements:
      path: FitOutWidgets/FitOutWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kevishsewliya.fitout]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevishsewliya.fitout.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FITOUT_WIDGET_EXTENSION"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  FitOutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FitOutTests]
    dependencies:
      - target: FitOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevishsewliya.fitout.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
  FitOutUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FitOutUITests]
    dependencies:
      - target: FitOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevishsewliya.fitout.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FitOut:
    build:
      targets:
        FitOut: all
    test:
      debugEnabled: false
      targets: [FitOutTests, {name: FitOutUITests, selectedTests: [FoundationUITests/testWorkoutSetSurvivesTerminationAndFinishes]}]
    run:
      debugEnabled: false
